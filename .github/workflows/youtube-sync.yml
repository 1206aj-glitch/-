name: 유튜브 새 설교 자동 업데이트

on:
  schedule:
    # 매시간 확인 — GitHub 예약 실행은 자주 늦거나 건너뛰므로 촘촘하게.
    # 오늘 한도를 이미 다 썼으면 요청 없이 몇 초 만에 끝남
    - cron: '41 * * * *'
  workflow_dispatch: {}   # Actions 탭에서 'Run workflow'로 즉시 실행 가능

permissions:
  contents: write
  actions: write     # 남은 설교가 있으면 다음 회차를 스스로 이어서 실행

# 동시에 두 개가 돌지 않도록 (앞 회차가 끝나면 다음 회차 실행)
concurrency:
  group: youtube-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 채널 새 영상 확인 후 index.html 갱신
        id: sync
        run: python scripts/sync_youtube.py
        env:
          # 하늘스크린교회 채널 (비워두면 기존 설교 영상에서 자동으로 찾습니다)
          # 저장소 Settings > Secrets and variables > Actions 에 등록한 YouTube API 키 (공개되지 않음)
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          # Google AI Studio에서 발급한 Gemini API 키 — 영상을 보고 요약·타임라인·키워드를 자동 작성 (없으면 건너뜀)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 한 번 실행에 AI로 정리할 최대 설교 수 (무료 한도: 하루 영상 8시간)
          AI_MAX_PER_RUN: '6'
          CHANNEL_ID: 'UCE2gX_bg3lq1-7bn7WZAPQQ'
          # 제목에 이 단어가 있는 영상만 추가 (| 로 여러 개)
          SERMON_KEYWORD: '설교|예배|말씀|주일|성탄|송구영신'
          # 올해 설교 정리가 끝나면 지난 설교(2025년 → 과거)를 하루 한도 안에서 한 편씩 AI 정리해 추가 (끄려면 'off')
          BACKFILL: 'on'
          # 지난 설교를 몇 년도까지 거슬러 올라갈지
          BACKFILL_FROM_YEAR: '2017'
          # 밴드 설교 영상을 모아두는 구글 드라이브 폴더 ID (저장소 Settings > Variables 의 DRIVE_FOLDER_ID)
          DRIVE_FOLDER_ID: ${{ vars.DRIVE_FOLDER_ID }}

      - name: 변경 사항 저장
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "새 설교 없음 — 변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html scripts/backfill_skip.json scripts/ai_state.json scripts/drive_skip.json
          git commit -m "유튜브 새 설교 자동 추가 / AI 정리"
          git pull --rebase
          git push

      - name: 남은 설교가 있으면 다음 회차 바로 실행
        if: steps.sync.outputs.more == 'true'
        run: gh workflow run youtube-sync.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 구글 서버 혼잡이면 20분 뒤 다시 실행
        if: steps.sync.outputs.busy == 'true'
        run: |
          sleep 1200
          gh workflow run youtube-sync.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
