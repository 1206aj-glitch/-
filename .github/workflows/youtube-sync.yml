name: 유튜브 새 설교 자동 업데이트

on:
  schedule:
    # 매주 일요일·월요일 밤 10시(한국시간)에 확인 — 주일 설교가 늦게 올라와도 다음 날 반영
    - cron: '0 13 * * 0'
    - cron: '0 13 * * 1'
  workflow_dispatch: {}   # Actions 탭에서 'Run workflow'로 즉시 실행 가능

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 채널 새 영상 확인 후 index.html 갱신
        run: python scripts/sync_youtube.py
        env:
          # 하늘스크린교회 채널 (비워두면 기존 설교 영상에서 자동으로 찾습니다)
          # 저장소 Settings > Secrets and variables > Actions 에 등록한 YouTube API 키 (공개되지 않음)
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          CHANNEL_ID: 'UCE2gX_bg3lq1-7bn7WZAPQQ'
          # 제목에 이 단어가 있는 영상만 추가 (| 로 여러 개)
          SERMON_KEYWORD: '설교|예배|말씀|주일|성탄|송구영신'

      - name: 변경 사항 저장
        run: |
          if git diff --quiet; then
            echo "새 설교 없음 — 변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "유튜브 새 설교 자동 추가"
          git push
